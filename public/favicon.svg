<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Telegram Resolver">
    <title>Telegram Resolver</title>
    <defs>
        <pattern id="halftone" width="3" height="3" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.6" fill="#3a3a3a" />
        </pattern>
    </defs>

    <!-- Engraved plate -->
    <rect width="32" height="32" fill="#0c0c0c" />
    <rect width="32" height="32" fill="url(#halftone)" />
    <rect x="1" y="1" width="30" height="30" fill="none" stroke="#d8d8d8" stroke-width="1.5" />

    <!-- A chat resolving into its topics -->
    <g fill="#d8d8d8" stroke="#d8d8d8" stroke-width="2">
        <rect x="6.5" y="5.5" width="5" height="5" stroke="none" />
        <path d="M9 10.5V22.5M9 15H17.5M9 22.5H17.5" fill="none" stroke-linecap="square" />
        <rect x="17.5" y="12.5" width="5" height="5" stroke="none" />
        <rect x="17.5" y="20" width="5" height="5" stroke="none" />
    </g>
</svg>
